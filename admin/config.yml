
backend:
  name: git-gateway
  branch: main

site_url: "https://hl-sas-web.netlify.app"
display_url: "https://hl-sas-web.netlify.app"
logo_url: "https://hl-sas-web.netlify.app/img/logoHL.png"

media_folder: "img/uploads"
public_folder: "/img/uploads"

locale: "es"

collections:
  - name: "contenido"
    label: "Contenido de la página"
    label_singular: "Contenido"
    description: "Edita los servicios y las fotografías que se muestran en la página web."
    files:
      - name: "sitio"
        label: "Servicios y galería"
        file: "content/site.json"
        format: "json"
        description: "Los cambios se publican automáticamente unos minutos después de guardar."
        fields:
          - label: "Servicios"
            name: "servicios"
            widget: "list"
            label_singular: "Servicio"
            collapsed: true
            summary: "{{fields.nombre}}"
            hint: "Arrastra las tarjetas para cambiar el orden en que aparecen en la web."
            fields:
              - label: "Nombre del servicio"
                name: "nombre"
                widget: "string"
                hint: "Ejemplo: Rejas, Puertas, Barandas."
              - label: "Descripción"
                name: "descripcion"
                widget: "text"
                hint: "Una frase corta (máximo 2 líneas)."
              - label: "Imagen"
                name: "imagen"
                widget: "image"
                required: false
                hint: "Formato horizontal, idealmente 700x500 px."

          - label: "Galería de trabajos"
            name: "galeria"
            widget: "list"
            label_singular: "Trabajo"
            collapsed: true
            summary: "{{fields.titulo}} — {{fields.categoria}}"
            hint: "Agrega aquí las fotografías de proyectos terminados."
            fields:
              - label: "Título del trabajo"
                name: "titulo"
                widget: "string"
              - label: "Descripción"
                name: "descripcion"
                widget: "text"
                required: false
              - label: "Categoría"
                name: "categoria"
                widget: "select"
                default: "otros"
                hint: "Se usa para el filtro de la galería en la página."
                options:
                  - { label: "Rejas", value: "rejas" }
                  - { label: "Puertas", value: "puertas" }
                  - { label: "Ventanas", value: "ventanas" }
                  - { label: "Estructuras industriales", value: "estructuras" }
                  - { label: "Otros", value: "otros" }
              - label: "Fotografía"
                name: "imagen"
                widget: "image"
                hint: "Usa imágenes de buena calidad; se recortan a formato horizontal."