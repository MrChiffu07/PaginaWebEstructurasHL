
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Panel de administración · Estructuras HL S.A.S.</title>
  <link rel="icon" type="image/png" href="/img/logoHL.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <style>
    :root {
      --hl-red: #e51f34;
      --hl-ink: #111214;
      --hl-paper: #f5f5f4;
      --hl-line: #dedfe2;
    }

    body,
    [class*="css-"] {
      font-family: "Manrope", system-ui, sans-serif;
    }

    [class*="AppMainContainer"],
    [class*="AppWrapper"] {
      background: var(--hl-paper);
    }

    [class*="AppHeader"] {
      background: var(--hl-ink);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .18);
    }

    [class*="AppHeaderActions"] [class*="AppHeaderButton"]:hover,
    [class*="AppHeaderNavLink"]:hover {
      color: #fff;
      background: rgba(229, 31, 52, .22);
    }

    [class*="AppHeaderSiteLink"] {
      color: #fff;
    }

    button[class*="PublishButton"],
    [class*="ToolbarButton"][class*="Primary"] {
      background-color: var(--hl-red);
    }

    [class*="CardWrapper"],
    [class*="ControlPaneContainer"],
    [class*="StyledListItem"],
    [class*="NestedObjectLabel"] {
      border-radius: 8px;
    }

    [class*="ObjectWidgetTopBar"] {
      border-radius: 8px 8px 0 0;
    }

    [class*="ControlContainer"] input,
    [class*="ControlContainer"] textarea,
    [class*="ControlContainer"] select {
      border-radius: 6px !important;
    }

    [class*="FieldLabel"] {
      font-weight: 700 !important;
    }

    [class*="ControlHint"] {
      color: #6a6b6f !important;
      font-size: .78rem;
    }

    [class*="LoginPageContainer"] {
      background: linear-gradient(140deg, #111214 0%, #1c1e21 55%, #2a0a0f 100%);
    }

    [class*="LoginButton"] {
      background-color: var(--hl-red) !important;
      border-radius: 24px !important;
      font-weight: 800;
    }

    [class*="CustomLogoIcon"],
    img[class*="Logo"] {
      max-width: 180px;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, .4));
    }

    .hl-admin-help {
      position: fixed;
      z-index: 9999;
      right: 18px;
      bottom: 18px;
      max-width: 260px;
      padding: 12px 14px;
      border-left: 4px solid var(--hl-red);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .16);
      color: var(--hl-ink);
      font-size: .74rem;
      line-height: 1.5;
    }

    .hl-admin-help strong {
      display: block;
      margin-bottom: 4px;
      font-size: .8rem;
    }

    .hl-admin-help button {
      margin-top: 8px;
      padding: 5px 12px;
      border: 1px solid var(--hl-line);
      border-radius: 14px;
      background: transparent;
      cursor: pointer;
      font: inherit;
      font-size: .7rem;
      font-weight: 700;
    }

    .hl-admin-help button:hover {
      border-color: var(--hl-red);
      color: var(--hl-red);
    }
  </style>
</head>
<body>
  <aside class="hl-admin-help" id="hl-admin-help" hidden>
    <strong>¿Cómo publicar cambios?</strong>
    Edita <em>Servicios y galería</em>, agrega o reordena los elementos y pulsa <b>Publicar</b>. La web se actualiza en unos minutos.
    <button type="button" id="hl-admin-help-close">Entendido</button>
  </aside>

  <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3/dist/decap-cms.js"></script>
  <script>
    const helpPanel = document.querySelector("#hl-admin-help");

    if (localStorage.getItem("hl-admin-help-dismissed") !== "1") {
      helpPanel.hidden = false;
    }

    document.querySelector("#hl-admin-help-close").addEventListener("click", () => {
      helpPanel.hidden = true;
      localStorage.setItem("hl-admin-help-dismissed", "1");
    });
  </script>
</body>
</html>
